apiVersion: apps/v1
kind: Deployment
metadata:
  name: logistic-backend
  namespace: logistic-world
spec:
  replicas: 1
  selector:
    matchLabels: { app: logistic-backend }
  template:
    metadata:
      labels: { app: logistic-backend }
    spec:
      containers:
        - name: api
          image: quay.io/CHANGE_ME/logistic-world-api:latest
          ports: [{ containerPort: 8080 }]
          env:
            - name: DB_URL
              value: jdbc:mysql://mysql:3306/logistic_world
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: logistic-world-db, key: username }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: logistic-world-db, key: password }
---
apiVersion: v1
kind: Service
metadata:
  name: logistic-backend
  namespace: logistic-world
spec:
  selector: { app: logistic-backend }
  ports: [{ port: 8080, targetPort: 8080 }]
